services:
  - type: web
    name: mcp-agent-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PROXY_API_KEY
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
