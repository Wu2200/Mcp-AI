services:
  - type: web
    name: mcp-ai-workspace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MCP_API_KEY
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
