<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 控制台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 24px 14px;
      line-height: 1.5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 2px;
    }
    .btn-logout {
      background: #ffffff;
      color: #64748b;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-logout:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-blue { background: #e0f2fe; color: #0369a1; }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-gray { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

    .group {
      margin-bottom: 14px;
    }
    .group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }
    .box {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #0f172a;
      word-break: break-all;
      user-select: all;
    }
    input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      border-radius: 8px;
      color: #0f172a;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .action-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-action {
      border: none;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-start {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .btn-start:hover {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }
    .btn-stop {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .btn-stop:hover {
      background: #d97706;
      color: #ffffff;
      border-color: #d97706;
    }
    .btn-del {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .btn-del:hover {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }

    .server-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .server-item:last-child {
      margin-bottom: 0;
    }
    .server-item.disabled {
      opacity: 0.7;
      background: #f1f5f9;
    }
    .server-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .server-item-title {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }
    .server-name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .server-item-url {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
      font-family: monospace;
      word-break: break-all;
    }
    .tool-toggle-bar {
      font-size: 13px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .tool-toggle-btn {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      font-weight: 500;
      white-space: nowrap;
    }
    .tool-toggle-btn:hover {
      text-decoration: underline;
    }
    .tools-container {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
      display: none;
    }
    .tag {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 11px;
      font-family: monospace;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px 4px 4px 0;
      word-break: break-all;
    }
    #conn-msg {
      margin-left: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .empty-state {
      text-align: center;
      padding: 28px 14px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>MCP 代理控制台</h1>
        <p>为客户端提供多 MCP 工具接入与持久化存储</p>
      </div>
      <button class="btn-logout" onclick="handleLogout()">退出登录</button>
    </div>

    <div class="card">
      <div class="card-title">
        <span>客户端连接配置</span>
        <span class="badge badge-blue">Chatbox 专用</span>
      </div>
      <div class="group">
        <label>API 域名 (Base URL)</label>
        <div class="box" id="proxy-url"></div>
      </div>
      <div class="group">
        <label>模型 (Model)</label>
        <div class="box">跟随你的上游设置（如 gpt-4o、gemini-2.5-flash 等）</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">手动挂载 MCP 服务（支持添加多个）</div>
      <div class="group">
        <label>服务前缀名称（如 Github、Gitlab、Notion 等）</label>
        <input id="mcp-name" value="Github" placeholder="输入唯一标识名称">
      </div>
      <div class="group">
        <label>MCP 服务地址 (HTTP / SSE 端点)</label>
        <input id="mcp-url" value="https://api.githubcopilot.com/mcp/" placeholder="https://...">
      </div>
      <div class="group">
        <label>认证令牌 (Token，可选)</label>
        <input id="mcp-token" type="password" placeholder="如需认证请粘贴 Token（如 ghu_、ghp_）">
      </div>
      <div style="display: flex; align-items: center; margin-top: 16px;">
        <button id="btn-conn" class="btn" onclick="handleConnect()">添加</button>
        <span id="conn-msg"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>已挂载 MCP 服务列表</span>
      </div>
      <div id="mcp-list">
        <div class="empty-state">正在加载服务列表...</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("proxy-url").innerText = window.location.origin + "/v1";

    async function handleLogout() {
      await fetch("/api/panel/logout", { method: "POST" });
      location.reload();
    }

    function toggleTools(id) {
      const el = document.getElementById("tools-" + id);
      const btn = document.getElementById("toggle-btn-" + id);
      if (!el || !btn) return;
      if (el.style.display === "block") {
        el.style.display = "none";
        btn.innerText = "[展开查看]";
      } else {
        el.style.display = "block";
        btn.innerText = "[点击收起]";
      }
    }

    async function loadServers() {
      try {
        const res = await fetch("/api/mcp/servers");
        if (res.status === 401) {
          location.reload();
          return;
        }
        const data = await res.json();
        const el = document.getElementById("mcp-list");
        if (!data.servers || data.servers.length === 0) {
          el.innerHTML = '<div class="empty-state">尚未挂载任何远程 MCP 服务。直接透传上游模型配置与联网搜索。</div>';
          return;
        }
        let html = "";
        for (let s of data.servers) {
          const isActive = s.status !== "disabled";
          const statusBadge = isActive
            ? '<span class="badge badge-green">运行中</span>'
            : '<span class="badge badge-gray">已断开</span>';

          const toggleActionBtn = isActive
            ? `<button class="btn-action btn-stop" onclick="handleStop('${s.id}')">断开</button>`
            : `<button class="btn-action btn-start" onclick="handleStart('${s.id}')">启动</button>`;

          let tags = s.tools.map(t => '<span class="tag">' + t.key + '</span>').join("");

          html += `
            <div class="server-item ${isActive ? '' : 'disabled'}">
              <div class="server-item-head">
                <div class="server-item-title">
                  <span class="server-name-text">${s.name}</span>
                  ${statusBadge}
                </div>
                <div class="action-group">
                  ${toggleActionBtn}
                  <button class="btn-action btn-del" onclick="handleDelete('${s.id}')">删除</button>
                </div>
              </div>
              <div class="server-item-url">${s.url}</div>
              <div class="tool-toggle-bar">
                <span>工具清单 (${s.toolCount})</span>
                <button id="toggle-btn-${s.id}" class="tool-toggle-btn" onclick="toggleTools('${s.id}')">[展开查看]</button>
              </div>
              <div id="tools-${s.id}" class="tools-container">
                ${tags}
              </div>
            </div>
          `;
        }
        el.innerHTML = html;
      } catch (e) {
        document.getElementById("mcp-list").innerHTML = '<div class="empty-state" style="color: #ef4444;">获取失败: ' + e.message + '</div>';
      }
    }

    async function handleConnect() {
      const name = document.getElementById("mcp-name").value.trim();
      const url = document.getElementById("mcp-url").value.trim();
      const token = document.getElementById("mcp-token").value.trim();
      const msg = document.getElementById("conn-msg");

      if (!name || !url) {
        msg.innerText = "名称与 URL 不能为空";
        msg.style.color = "#dc2626";
        return;
      }

      msg.innerText = "正在握手连接...";
      msg.style.color = "#2563eb";

      try {
        const res = await fetch("/api/mcp/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, url, token })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "连接失败");
        msg.innerText = "成功载入 " + data.toolCount + " 个工具！";
        msg.style.color = "#16a34a";
        document.getElementById("mcp-token").value = "";
        loadServers();
      } catch (err) {
        msg.innerText = err.message;
        msg.style.color = "#dc2626";
      }
    }

    async function handleStart(id) {
      await fetch('/api/mcp/servers/' + id + '/start', { method: "POST" });
      loadServers();
    }

    async function handleStop(id) {
      await fetch('/api/mcp/servers/' + id + '/stop', { method: "POST" });
      loadServers();
    }

    async function handleDelete(id) {
      if (!confirm("确认彻底删除该 MCP 服务？")) return;
      await fetch('/api/mcp/servers/' + id, { method: "DELETE" });
      loadServers();
    }

    loadServers();
  </script>
</body>
</html>
