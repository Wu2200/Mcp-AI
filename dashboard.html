<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP-AI 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 14px; background: #f1f5f9; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; }
    main { max-width: 850px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    p { color: #64748b; font-size: 13px; }
    .card { padding: 18px; margin-bottom: 14px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 3px #0f172a0a; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; color: #475569; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    input:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
    button { padding: 8px 12px; border: 0; border-radius: 7px; background: #2563eb; color: white; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .55; cursor: wait; }
    button.secondary { background: #e2e8f0; color: #334155; }
    button.danger { background: #fee2e2; color: #991b1b; }
    button.neutral { background: #fef3c7; color: #92400e; }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .endpoint { overflow-wrap: anywhere; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; font-family: ui-monospace, monospace; user-select: all; }
    .hint { margin: 7px 0 0; }
    .server { margin-top: 10px; padding: 13px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
    .server-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .server-name { font-weight: 700; overflow-wrap: anywhere; }
    .server-url { margin-top: 4px; color: #64748b; font: 12px ui-monospace, monospace; overflow-wrap: anywhere; }
    .tools { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #cbd5e1; }
    .tool { display: flex; align-items: center; gap: 8px; padding: 5px 0; font: 12px ui-monospace, monospace; overflow-wrap: anywhere; }
    .tool input { width: 16px; height: 16px; }
    .badge { padding: 2px 8px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 11px; }
    .badge.off { background: #e2e8f0; color: #475569; }
    #logs { max-height: 440px; overflow: auto; padding: 10px; border-radius: 8px; background: #0f172a; color: #e2e8f0; font: 12px ui-monospace, monospace; }
    .log { padding: 7px 0; border-bottom: 1px solid #334155; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { padding: 20px 8px; text-align: center; color: #94a3b8; font-size: 13px; }
    #message { min-height: 20px; margin-top: 8px; font-size: 13px; }
    @media (max-width: 520px) { body { padding: 14px 9px; } .card { padding: 14px; } header { align-items: flex-start; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>MCP-AI 反向代理</h1>
        <p>聚合并转发已挂载 MCP 服务的原生工具，不需要配置 AI 模型或 AI 上游接口。</p>
      </div>
      <button class="secondary" id="logout">退出登录</button>
    </header>

    <section class="card">
      <h2>挂载远程 MCP 服务</h2>
      <form id="connect-form">
        <div class="field"><label for="mcp-name">服务名称</label><input id="mcp-name" value="GitHub" required></div>
        <div class="field"><label for="mcp-url">MCP 服务地址</label><input id="mcp-url" placeholder="https://example.com/mcp" required></div>
        <div class="field"><label for="mcp-token">上游 MCP 认证令牌（可选）</label><input id="mcp-token" type="password" autocomplete="off" placeholder="Bearer token"></div>
        <button id="connect-button" type="submit">连接并挂载</button>
        <div id="message" role="status"></div>
      </form>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between"><h2>已挂载服务</h2><button id="refresh-servers" class="secondary">刷新</button></div>
      <div id="servers"><div class="empty">正在加载 MCP 服务...</div></div>
    </section>

    <section class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:10px">
        <h2 style="margin:0">MCP 调用日志</h2>
        <div class="row"><span id="log-status" class="badge">日志开启</span><button id="toggle-logs" class="neutral">关闭日志</button><button id="copy-logs" class="secondary">复制</button><button id="clear-logs" class="danger">清空</button><button id="refresh-logs" class="secondary">刷新</button></div>
      </div>
      <div id="logs"><div class="empty">暂无 MCP 调用记录</div></div>
    </section>
  </main>
  <script>
    const serversEl = document.getElementById("servers");
    const logsEl = document.getElementById("logs");
    const messageEl = document.getElementById("message");
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[char]);

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      let data = {};
      try { data = await response.json(); } catch {}
      if (response.status === 401 && url.startsWith("/api/")) location.reload();
      if (!response.ok) throw new Error(data.error || `请求失败 (${response.status})`);
      return data;
    }

    async function loadServers() {
      try {
        const data = await requestJson("/api/mcp/servers");
        const servers = data.servers || [];
        if (!servers.length) {
          serversEl.innerHTML = '<div class="empty">尚未挂载 MCP 服务。添加远程 MCP 服务后，其工具将通过上方地址提供。</div>';
          return;
        }
        serversEl.innerHTML = servers.map((server) => {
          const active = server.status !== "disabled";
          const tools = (server.tools || []).map((tool) => `
            <label class="tool"><input type="checkbox" data-toggle-tool data-server-id="${escapeHtml(server.id)}" data-tool-key="${escapeHtml(tool.key)}" ${tool.enabled === false ? "" : "checked"}><span>${escapeHtml(tool.rawName || tool.key)}</span></label>
          `).join("");
          return `
            <article class="server">
              <div class="server-head">
                <div class="row"><span class="server-name">${escapeHtml(server.name)}</span><span class="badge ${active ? "" : "off"}">${active ? "运行中" : "已断开"}</span></div>
                <div class="row">
                  <button class="secondary" data-action="edit" data-id="${escapeHtml(server.id)}">编辑</button>
                  <button class="${active ? "neutral" : ""}" data-action="${active ? "stop" : "start"}" data-id="${escapeHtml(server.id)}">${active ? "断开" : "启动"}</button>
                  <button class="danger" data-action="delete" data-id="${escapeHtml(server.id)}">删除</button>
                </div>
              </div>
              <div class="server-url">${escapeHtml(server.url)}</div>
              <div class="tools"><div style="color:#64748b">工具 ${Number(server.toolCount) || 0} 个</div>${tools}</div>
            </article>
          `;
        }).join("");
      } catch (error) {
        serversEl.innerHTML = `<div class="empty">加载失败：${escapeHtml(error.message)}</div>`;
      }
    }

    async function loadLogs() {
      try {
        const data = await requestJson("/api/logs");
        const entries = data.mcpLogs || [];
        const status = document.getElementById("log-status");
        const toggle = document.getElementById("toggle-logs");
        status.textContent = data.enabled ? "日志开启" : "日志暂停";
        status.className = `badge${data.enabled ? "" : " off"}`;
        toggle.textContent = data.enabled ? "关闭日志" : "开启日志";
        toggle.className = data.enabled ? "neutral" : "";
        logsEl.innerHTML = entries.length ? [...entries].reverse().map((entry) => `<div class="log">[${escapeHtml(entry.time)}] [${escapeHtml(entry.type)}] ${escapeHtml(entry.summary)}${entry.detail ? `\n${escapeHtml(entry.detail)}` : ""}</div>`).join("") : '<div class="empty">暂无 MCP 调用记录</div>';
      } catch (error) {
        logsEl.innerHTML = `<div class="empty">加载失败：${escapeHtml(error.message)}</div>`;
      }
    }

    document.getElementById("connect-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("connect-button");
      const payload = {
        name: document.getElementById("mcp-name").value.trim(),
        url: document.getElementById("mcp-url").value.trim(),
        token: document.getElementById("mcp-token").value.trim()
      };
      button.disabled = true;
      messageEl.textContent = "正在连接并读取工具列表...";
      messageEl.style.color = "#2563eb";
      try {
        const data = await requestJson("/api/mcp/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        messageEl.textContent = `已挂载，读取到 ${data.toolCount} 个工具。`;
        messageEl.style.color = "#15803d";
        document.getElementById("mcp-token").value = "";
        await loadServers();
      } catch (error) {
        messageEl.textContent = error.message;
        messageEl.style.color = "#dc2626";
      } finally {
        button.disabled = false;
      }
    });

    serversEl.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const id = button.dataset.id;
      const action = button.dataset.action;
      try {
        if (action === "delete" && !confirm("确认删除该 MCP 服务？")) return;
        if (action === "edit") {
          const server = (await requestJson("/api/mcp/servers")).servers.find((item) => item.id === id);
          if (!server) throw new Error("未找到 MCP 服务");
          const name = prompt("服务名称", server.name);
          if (name === null) return;
          const url = prompt("MCP 服务地址", server.url);
          if (url === null) return;
          const token = prompt("新认证令牌（留空保留当前令牌）", "");
          if (token === null) return;
          await requestJson(`/api/mcp/servers/${encodeURIComponent(id)}/update`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, url, token }) });
        } else if (action === "delete") {
          await requestJson(`/api/mcp/servers/${encodeURIComponent(id)}`, { method: "DELETE" });
        } else {
          await requestJson(`/api/mcp/servers/${encodeURIComponent(id)}/${action}`, { method: "POST" });
        }
        await loadServers();
      } catch (error) {
        alert(error.message);
      }
    });

    serversEl.addEventListener("change", async (event) => {
      const checkbox = event.target.closest("[data-toggle-tool]");
      if (!checkbox) return;
      try {
        await requestJson(`/api/mcp/servers/${encodeURIComponent(checkbox.dataset.serverId)}/tools/${encodeURIComponent(checkbox.dataset.toolKey)}/toggle`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: checkbox.checked }) });
        await loadServers();
      } catch (error) {
        alert(error.message);
        await loadServers();
      }
    });

    document.getElementById("refresh-servers").addEventListener("click", loadServers);
    document.getElementById("refresh-logs").addEventListener("click", loadLogs);
    document.getElementById("toggle-logs").addEventListener("click", async () => {
      try {
        await requestJson("/api/logs/toggle", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: document.getElementById("log-status").textContent !== "日志开启" }) });
        await loadLogs();
      } catch (error) { alert(error.message); }
    });
    document.getElementById("clear-logs").addEventListener("click", async () => {
      if (!confirm("确认清空全部 MCP 调用日志？")) return;
      try {
        await requestJson("/api/logs/clear", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ category: "mcp" }) });
        await loadLogs();
      } catch (error) { alert(error.message); }
    });
    document.getElementById("copy-logs").addEventListener("click", async () => {
      const text = [...logsEl.querySelectorAll(".log")].map((item) => item.textContent).join("\n\n");
      if (!text) { alert("暂无日志可复制"); return; }
      try { await navigator.clipboard.writeText(text); } catch { alert("复制失败"); }
    });
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/panel/logout", { method: "POST" });
      location.reload();
    });

    loadServers();
    loadLogs();
    setInterval(loadLogs, 5000);
  </script>
</body>
</html>
