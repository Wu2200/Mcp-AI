<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 控制台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 32px 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .header p {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0369a1;
    }
    .group {
      margin-bottom: 16px;
    }
    .group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }
    .box {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #0f172a;
      word-break: break-all;
      user-select: all;
    }
    input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 10px 14px;
      border-radius: 8px;
      color: #0f172a;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: #ffffff;
      border: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-danger:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }
    .server-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .server-item:last-child {
      margin-bottom: 0;
    }
    .server-item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .server-item-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
    }
    .server-item-url {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
      font-family: monospace;
    }
    .tag {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 11px;
      font-family: monospace;
      padding: 2px 8px;
      border-radius: 4px;
      margin: 2px 4px 2px 0;
    }
    #conn-msg {
      margin-left: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MCP 代理控制台</h1>
      <p>为 Chatbox 和 OpenAI 生态客户端提供全自动 MCP 工具接入</p>
    </div>

    <div class="card">
      <div class="card-title">
        <span>客户端连接配置</span>
        <span class="badge">Chatbox 专用</span>
      </div>
      <div class="group">
        <label>API 域名 (Base URL)</label>
        <div class="box" id="proxy-url"></div>
      </div>
      <div class="group">
        <label>模型 (Model)</label>
        <div class="box">跟随你的上游设置（如 gpt-4o、gemini-2.5-flash 等）</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">挂载远程 MCP 服务</div>
      <div class="group">
        <label>服务前缀名称</label>
        <input id="mcp-name" value="Github" placeholder="例如 Github、Gitlab、Notion">
      </div>
      <div class="group">
        <label>MCP 服务地址</label>
        <input id="mcp-url" value="https://api.githubcopilot.com/mcp/" placeholder="https://...">
      </div>
      <div class="group">
        <label>认证令牌 (Token，可选)</label>
        <input id="mcp-token" type="password" placeholder="如需认证请粘贴 Token（如 ghu_、ghp_）">
      </div>
      <div style="display: flex; align-items: center; margin-top: 18px;">
        <button id="btn-conn" class="btn" onclick="handleConnect()">连接并提取工具</button>
        <span id="conn-msg"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">已挂载 MCP 服务列表</div>
      <div id="mcp-list">
        <div class="empty-state">正在加载配置...</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("proxy-url").innerText = window.location.origin + "/v1";

    async function loadServers() {
      try {
        const res = await fetch("/api/mcp/servers");
        const data = await res.json();
        const el = document.getElementById("mcp-list");
        if (!data.servers || data.servers.length === 0) {
          el.innerHTML = '<div class="empty-state">尚未挂载任何远程 MCP 服务。直接透传上游配置与内置搜索。</div>';
          return;
        }
        let html = "";
        for (let s of data.servers) {
          let tags = s.tools.map(t => '<span class="tag">' + t.key + '</span>').join("");
          html += '<div class="server-item">' +
            '<div class="server-item-head">' +
              '<span class="server-item-title">' + s.name + ' <span class="badge">' + s.toolCount + ' 个工具</span></span>' +
              '<button class="btn-danger" onclick="handleDelete(\'' + s.id + '\')">断开连接</button>' +
            '</div>' +
            '<div class="server-item-url">' + s.url + '</div>' +
            '<div>' + tags + '</div>' +
          '</div>';
        }
        el.innerHTML = html;
      } catch (e) {
        document.getElementById("mcp-list").innerHTML = '<div class="empty-state" style="color: #ef4444;">获取失败: ' + e.message + '</div>';
      }
    }

    async function handleConnect() {
      const name = document.getElementById("mcp-name").value.trim();
      const url = document.getElementById("mcp-url").value.trim();
      const token = document.getElementById("mcp-token").value.trim();
      const msg = document.getElementById("conn-msg");

      if (!name || !url) {
        msg.innerText = "名称与 URL 不能为空";
        msg.style.color = "#dc2626";
        return;
      }

      msg.innerText = "正在握手连接...";
      msg.style.color = "#2563eb";

      try {
        const res = await fetch("/api/mcp/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, url, token })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "连接失败");
        msg.innerText = "成功载入 " + data.toolCount + " 个工具！";
        msg.style.color = "#16a34a";
        document.getElementById("mcp-token").value = "";
        loadServers();
      } catch (err) {
        msg.innerText = err.message;
        msg.style.color = "#dc2626";
      }
    }

    async function handleDelete(id) {
      if (!confirm("确认断开该 MCP？")) return;
      await fetch('/api/mcp/servers/' + id, { method: "DELETE" });
      loadServers();
    }

    loadServers();
  </script>
</body>
</html>
