<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP 控制台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0b0f19; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: #151c2e; border: 1px solid #232f48; border-radius: 8px; padding: 18px; margin-bottom: 18px; }
    .title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #38bdf8; }
    .box { background: #0b0f19; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-bottom: 12px; word-break: break-all; }
    .group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    input, textarea { width: 100%; background: #0b0f19; border: 1px solid #232f48; padding: 8px 10px; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    button { background: #38bdf8; color: #0b0f19; border: none; font-weight: bold; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-danger { background: #ef4444; color: #fff; padding: 4px 8px; font-size: 12px; }
    .server-item { background: #0b0f19; border: 1px solid #232f48; padding: 12px; border-radius: 6px; margin-bottom: 8px; }
    .server-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .tag { display: inline-block; background: #232f48; font-size: 12px; padding: 2px 6px; border-radius: 4px; margin: 2px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="font-size: 20px; margin-bottom: 16px;">MCP 代理连接面板</h1>

    <div class="card">
      <div class="title">Chatbox 接口信息</div>
      <label>API 域名 (Base URL)</label>
      <div class="box" id="proxy-url"></div>
      <label>模型 (Model)</label>
      <div class="box">任意大模型名称</div>
    </div>

    <div class="card">
      <div class="title">挂载远程 MCP 服务</div>
      <div class="group">
        <label>服务前缀名称</label>
        <input id="mcp-name" value="Github">
      </div>
      <div class="group">
        <label>MCP 服务地址</label>
        <input id="mcp-url" value="https://api.githubcopilot.com/mcp/">
      </div>
      <div class="group">
        <label>认证令牌 (Token，如 ghu_ 或 ghp_)</label>
        <input id="mcp-token" type="password" placeholder="粘贴你的 Token">
      </div>
      <button id="btn-conn" onclick="handleConnect()">连接并提取工具</button>
      <span id="conn-msg" style="margin-left: 10px; font-size: 13px;"></span>
    </div>

    <div class="card">
      <div class="title">已挂载 MCP 服务列表</div>
      <div id="mcp-list" style="color: #94a3b8; font-size: 13px;">加载中...</div>
    </div>
  </div>

  <script>
    document.getElementById("proxy-url").innerText = window.location.origin + "/v1";

    async function loadServers() {
      try {
        const res = await fetch("/api/mcp/servers");
        const data = await res.json();
        const el = document.getElementById("mcp-list");
        if (data.servers.length === 0) {
          el.innerHTML = "尚未添加任何 MCP 服务。";
          return;
        }
        let html = "";
        for (let s of data.servers) {
          let tags = s.tools.map(t => '<span class="tag">' + t.key + '</span>').join("");
          html += '<div class="server-item">' +
            '<div class="server-item-head">' +
              '<strong>' + s.name + ' (' + s.toolCount + ' 个工具)</strong>' +
              '<button class="btn-danger" onclick="handleDelete(\\'' + s.id + '\\')">断开</button>' +
            '</div>' +
            '<div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px;">' + s.url + '</div>' +
            '<div>' + tags + '</div>' +
          '</div>';
        }
        el.innerHTML = html;
      } catch (e) {
        document.getElementById("mcp-list").innerHTML = "获取失败: " + e.message;
      }
    }

    async function handleConnect() {
      const name = document.getElementById("mcp-name").value.trim();
      const url = document.getElementById("mcp-url").value.trim();
      const token = document.getElementById("mcp-token").value.trim();
      const msg = document.getElementById("conn-msg");

      if (!name || !url) {
        msg.innerText = "名称与 URL 不能为空";
        msg.style.color = "#ef4444";
        return;
      }

      msg.innerText = "正在握手连接...";
      msg.style.color = "#38bdf8";

      try {
        const res = await fetch("/api/mcp/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, url, token })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "连接失败");
        msg.innerText = "成功载入 " + data.toolCount + " 个工具！";
        msg.style.color = "#10b981";
        document.getElementById("mcp-token").value = "";
        loadServers();
      } catch (err) {
        msg.innerText = err.message;
        msg.style.color = "#ef4444";
      }
    }

    async function handleDelete(id) {
      if (!confirm("确认断开该 MCP？")) return;
      await fetch('/api/mcp/servers/' + id, { method: "DELETE" });
      loadServers();
    }

    loadServers();
  </script>
</body>
</html>
